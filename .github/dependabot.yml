# Monthly, grouped, 7-day cooldown. Cargo stays manual (CLAUDE.md → Dependencies).
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      site:
        patterns: ["*"]
    ignore:
      # @astrojs/check peers on typescript ^5 || ^6, so a TypeScript 7 bump breaks `npm ci`.
      # Drop once it accepts 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /site
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      site-image:
        patterns: ["*"]
