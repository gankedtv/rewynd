server {
    listen       80;
    # nginx:alpine's entrypoint only injects this into the stock default.conf it
    # shipped (it checksums the file first), so replacing that file means
    # declaring IPv6 ourselves. Without it `localhost` — which resolves to ::1
    # before 127.0.0.1 in the container — is refused, and any healthcheck built
    # on wget or nc fails.
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Astro's build emits 404.html; without this nginx serves its own default page.
    error_page 404 /404.html;
    # error_page redirects internally into this exact-match location, which inherits
    # no add_header from `location /` — and the response stays a 404, which plain
    # add_header skips. Hence the repeat, with `always`.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   256;
    # nginx labels .xml as text/xml, so the sitemap needs that type listed too.
    gzip_types        text/plain text/css text/xml application/javascript
                      application/json image/svg+xml application/xml;

    # Everything under _astro/ is content-hashed, so it can never go stale.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else revalidates: the HTML names the hashed assets a redeploy
    # replaces, and the rest (og-card, logo, robots, sitemap) keeps a stable name
    # while its content can change. A 304 is cheap; serving stale HTML is not.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
